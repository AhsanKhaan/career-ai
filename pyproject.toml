[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-ai"
version = "0.1.0"
description = "AI-powered job search automation — YAML-driven, CLI-first, OpenClaw-optimized"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "docx2pdf>=0.1.8",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
career = "career_ai.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
