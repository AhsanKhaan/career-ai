# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# Customized for: Ahsan Khan - Senior Software Engineer
# Focus: React/MERN/Laravel, Fintech, Saudi Arabia (Riyadh), Remote + Visa Sponsorship

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Frontend/Full Stack roles --
    - "Software Engineer"
    - "Frontend"
    - "Front End"
    - "Front-End"
    - "Full Stack"
    - "Fullstack"
    - "Full-Stack"
    - "Web Developer"
    - "Web Engineer"
    - "Application Developer"
    - "UI Engineer"
    - "Platform Engineer"
    - "Product Engineer"
    # -- Tech stack specific --
    - "React"
    - "React.js"
    - "ReactJS"
    - "Next.js"
    - "Node.js"
    - "Node"
    - "TypeScript"
    - "JavaScript"
    - "MERN"
    - "Laravel"
    - "PHP"
    # -- Fintech roles --
    - "Fintech"
    - "Payments"
    - "Payment"
    - "Banking"
    - "Financial"
    # -- Arabic keywords (GCC market) --
    - "مطور"
    - "مهندس برمجيات"
  negative:
    # Roles to exclude
    - "Junior"
    - "Intern"
    - "Internship"
    - "Entry Level"
    - "Graduate"
    - "Trainee"
    - "iOS"
    - "Android"
    - "Mobile Developer"
    - "Mobile Engineer"
    - "React Native"
    - "Flutter"
    - "Data Scientist"
    - "Data Engineer"
    - "ML Engineer"
    - "Machine Learning"
    - "AI Engineer"
    - "DevOps"
    - "SRE"
    - "Site Reliability"
    - "Security Engineer"
    - "QA Engineer"
    - "Test Engineer"
    - "Embedded"
    - "Firmware"
    - "Hardware"
    - "FPGA"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP"
    - "Salesforce Admin"
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - ".NET"
    - "Java "
    - "C++"
    - "Rust"
    - "Golang"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:

  # -- SAUDI ARABIA SPECIFIC --

  - name: Ashby — React Saudi Arabia
    query: 'site:jobs.ashbyhq.com "React" OR "Frontend" OR "Full Stack" "Saudi Arabia" OR "Riyadh"'
    enabled: true

  - name: Ashby — Software Engineer Riyadh
    query: 'site:jobs.ashbyhq.com "Software Engineer" OR "Web Developer" Riyadh'
    enabled: true

  - name: Greenhouse — React Saudi
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "React" OR "Frontend" "Saudi Arabia" OR "Riyadh"'
    enabled: true

  - name: Greenhouse — Full Stack Saudi
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Full Stack" OR "Node.js" Saudi Arabia'
    enabled: true

  - name: Lever — Frontend Saudi
    query: 'site:jobs.lever.co "React" OR "Frontend" OR "TypeScript" Saudi Arabia OR Riyadh'
    enabled: true

  - name: LinkedIn — React Riyadh Visa
    query: 'site:linkedin.com/jobs "React Developer" OR "Frontend Engineer" Riyadh "visa sponsorship"'
    enabled: true

  - name: LinkedIn — Full Stack Saudi Fintech
    query: 'site:linkedin.com/jobs "Full Stack" OR "Software Engineer" "Saudi Arabia" fintech'
    enabled: true

  # -- UAE / MIDDLE EAST --

  - name: Greenhouse — React Dubai
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "React" OR "Frontend" Dubai OR UAE'
    enabled: true

  - name: Ashby — Software Engineer Dubai
    query: 'site:jobs.ashbyhq.com "Software Engineer" OR "Full Stack" Dubai'
    enabled: true

  - name: Lever — Frontend UAE
    query: 'site:jobs.lever.co "React" OR "Frontend" OR "Node.js" UAE OR Dubai'
    enabled: true

  # -- REMOTE + VISA SPONSORSHIP --

  - name: Ashby — React Remote
    query: 'site:jobs.ashbyhq.com "React" OR "Frontend" remote worldwide'
    enabled: true

  - name: Ashby — Full Stack Remote
    query: 'site:jobs.ashbyhq.com "Full Stack" OR "Node.js" remote'
    enabled: true

  - name: Ashby — TypeScript Remote
    query: 'site:jobs.ashbyhq.com "TypeScript" OR "Next.js" remote senior'
    enabled: true

  - name: Greenhouse — React Remote
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "React" OR "Frontend Engineer" remote worldwide'
    enabled: true

  - name: Greenhouse — Full Stack Remote
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Full Stack" OR "Software Engineer" remote'
    enabled: true

  - name: Greenhouse — Node.js Remote
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Node.js" OR "TypeScript" remote senior'
    enabled: true

  - name: Lever — React Remote
    query: 'site:jobs.lever.co "React" OR "Frontend" remote'
    enabled: true

  - name: Lever — Full Stack Remote
    query: 'site:jobs.lever.co "Full Stack Engineer" OR "Software Engineer" remote'
    enabled: true

  - name: Wellfound — React Remote
    query: 'site:wellfound.com "React" OR "Frontend" remote'
    enabled: true

  - name: Wellfound — Full Stack Fintech
    query: 'site:wellfound.com "Full Stack" fintech remote'
    enabled: true

  # -- FINTECH SPECIFIC --

  - name: Ashby — Fintech React
    query: 'site:jobs.ashbyhq.com fintech "React" OR "Frontend" OR "Full Stack"'
    enabled: true

  - name: Greenhouse — Fintech Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io fintech "Software Engineer" OR "Frontend"'
    enabled: true

  - name: Lever — Payments React
    query: 'site:jobs.lever.co payments "React" OR "Node.js" OR "TypeScript"'
    enabled: true

  - name: Greenhouse — Payments Full Stack
    query: 'site:boards.greenhouse.io payments "Full Stack" OR "Software Engineer"'
    enabled: true

  # -- EUROPEAN VISA SPONSORS --

  - name: Greenhouse — React Berlin Relocation
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "React" OR "Frontend" Berlin relocation OR "visa sponsorship"'
    enabled: true

  - name: Ashby — Full Stack Amsterdam
    query: 'site:jobs.ashbyhq.com "Full Stack" OR "Software Engineer" Amsterdam OR Netherlands relocation'
    enabled: true

  - name: Lever — Frontend London Visa
    query: 'site:jobs.lever.co "Frontend" OR "React" London "visa sponsorship"'
    enabled: true

  - name: Greenhouse — Node.js Germany
    query: 'site:boards.greenhouse.io "Node.js" OR "TypeScript" Germany relocation'
    enabled: true

  # -- LARAVEL / PHP SPECIFIC --

  - name: Ashby — Laravel Remote
    query: 'site:jobs.ashbyhq.com "Laravel" OR "PHP" remote senior'
    enabled: true

  - name: Greenhouse — Laravel
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Laravel" OR "PHP Developer"'
    enabled: true

  - name: Lever — PHP Laravel
    query: 'site:jobs.lever.co "Laravel" OR "PHP" senior'
    enabled: true

  # -- REMOTE JOB BOARDS --

  - name: WeWorkRemotely — React
    query: 'site:weworkremotely.com "React" OR "Frontend"'
    enabled: true

  - name: WeWorkRemotely — Full Stack
    query: 'site:weworkremotely.com "Full Stack" OR "Node.js"'
    enabled: true

  - name: RemoteOK — React
    query: 'site:remoteok.com "React" OR "Frontend" OR "TypeScript"'
    enabled: true

  - name: RemoteFront — Frontend
    query: 'site:remotefront.com "React" OR "Frontend" OR "Full Stack" remote'
    enabled: true

